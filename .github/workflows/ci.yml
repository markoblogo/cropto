name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/cropto_test
      JWT_SECRET: test-secret-key-for-ci
      SESSION_SECRET: test-session-secret-for-ci
      JOB_RUNNER_SECRET: test-job-runner-secret-for-ci
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cropto_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run static checks and unit tests
        run: |
          npm run check
          npm run i18n:check
          npm test

      - name: Build application
        run: npm run build

      - name: Prepare test database
        run: npm run db:push

      - name: Start server
        run: |
          npm run start > server.log 2>&1 &
          echo $! > server.pid
        env:
          NODE_ENV: production
          PORT: 5000

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -f http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          cat server.log
          echo "Server failed to start"
          exit 1

      - name: Health check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health)
          if [ "$response" -eq 200 ]; then
            echo "✓ Health check passed (HTTP $response)"
            exit 0
          else
            echo "✗ Health check failed (HTTP $response)"
            exit 1
          fi

      - name: Run API integration tests
        run: npm run test:integration
        env:
          RUN_INTEGRATION_TESTS: '1'

      - name: Cleanup
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi
