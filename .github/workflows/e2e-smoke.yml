name: E2E Smoke Test

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Public or staging API base URL'
        required: false
        default: 'https://cr0pto.com'
        type: string

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      
      - name: Run E2E Smoke Test
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'https://cr0pto.com' }}
        run: npm run e2e:smoke
        continue-on-error: false
      
      - name: Report results
        if: always()
        run: |
          echo "E2E Smoke Test completed"
          echo "See logs above for detailed results"
